<!doctype html>
<html><head><meta charset="utf-8">
<!-- Slide 1 of the crime carousel: crime in Hume under Labor (CSA, year to Jun 2026 vs year to Dec 2022). Same layout language as slide 2
     (tech-colleges.html) but in Labor red and white; only the Liberal sign-off (name block + logo) stays navy/blue.
     Hard numbers as stat tiles; national rankings as a "Labor's record" list with red crosses (mirrors slide 2's ticks). -->
<style>
@font-face{font-family:"Serif Bold";src:url(DMSerifDisplay-Regular.ttf)}
@font-face{font-family:"Serif Light";src:url(InstrumentSerif-Regular.ttf)}
@font-face{font-family:"Inter";font-weight:500;src:url(Inter-Medium.otf)}
@font-face{font-family:"Inter";font-weight:600;src:url(Inter-SemiBold.otf)}
@font-face{font-family:"Inter";font-weight:700;src:url(Inter-Bold.otf)}
@font-face{font-family:"Inter";font-weight:800;src:url(Inter-ExtraBold.otf)}
:root{ --ink:#1e1b1c; --red:#d7262e; --red-deep:#b81f26; --navy:#162133; --blue:#00539a; --shadow:0 2px 6px rgba(40,20,20,.14); }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#fff}
#stage{position:relative;width:1080px;height:1350px;overflow:hidden;background:#fff}
.abs{position:absolute}
#bg{inset:0;width:1080px;height:1350px;object-fit:cover;filter:grayscale(.55) contrast(.95)}
#wash{inset:0;background:linear-gradient(180deg,rgba(255,255,255,var(--w-top)) 0%,rgba(255,255,255,var(--w-top)) 20%,rgba(255,255,255,var(--w-mid)) 34%,rgba(255,255,255,var(--w-mid)) 76%,rgba(255,255,255,var(--w-bot)) 90%)}
#col{left:60px;right:60px;top:var(--top);display:flex;flex-direction:column;align-items:center;text-align:center}
h1{font-family:"Inter";font-weight:800;color:var(--ink);letter-spacing:-.035em;line-height:1.02;white-space:nowrap;text-shadow:var(--shadow)}
h1 .acc{color:var(--red)}
h1 .ul{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:.07em;text-underline-offset:.12em}
.serif{color:var(--red-deep);line-height:1.1;letter-spacing:-.015em;text-shadow:var(--shadow)}
.serif .lt{font-family:"Serif Light";font-size:1.12em;letter-spacing:-.02em}
.serif .bd{font-family:"Serif Bold";display:inline-block;transform:scaleX(.86)}
.card{width:100%;border-radius:32px;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);
  box-shadow:inset 0 0 0 1.5px rgba(215,38,46,.14),0 18px 40px rgba(60,20,20,.10)}
/* stat tiles */
#stats{display:flex;padding:30px 18px 28px}
.st{flex:1;padding:0 14px}
.st .n{font-family:"Serif Bold";color:var(--red);line-height:1;display:inline-block;transform:scaleX(.86);white-space:nowrap;text-shadow:var(--shadow)}
.st .d{margin-top:8px;font-family:"Inter";font-weight:700;color:var(--red);letter-spacing:-.01em;line-height:1}
.st .l{margin-top:10px;font-family:"Inter";font-weight:700;color:var(--ink);letter-spacing:-.015em;line-height:1.25}
/* Labor's record: red cross list */
#record{padding:26px 40px 26px;text-align:left;background:linear-gradient(170deg,rgba(255,244,244,.95),rgba(252,232,232,.95))}
#record .lab{font-family:"Inter";font-weight:700;color:var(--red);letter-spacing:.07em;text-transform:uppercase;line-height:1}
#record .rows{margin-top:16px;display:flex;flex-direction:column;gap:14px}
.x{display:flex;gap:18px;align-items:center;font-family:"Inter";font-weight:600;color:var(--ink);letter-spacing:-.015em;line-height:1.28}
.x b{font-weight:800;color:var(--red)}
.x svg{flex:none}
#swipe{display:inline-flex;align-items:center;gap:12px;padding:13px 26px;border-radius:999px;background:var(--red);color:#fff;
  font-family:"Inter";font-weight:700;letter-spacing:-.01em;box-shadow:0 10px 24px rgba(215,38,46,.25)}
#swipe svg{width:1.1em;height:1.1em}
#foot{display:flex;flex-direction:column;align-items:center}
#names{display:grid;grid-template-columns:repeat(var(--ncols),var(--ncol));justify-content:center;align-items:start;column-gap:var(--ngap)}
.cand{text-align:center}
.cand .n{font-family:"Serif Bold";color:var(--navy);line-height:1;letter-spacing:-.01em;white-space:nowrap;text-shadow:var(--shadow);display:inline-block;transform:scaleX(.86)}
.cand .r{margin-top:5px;font-family:"Inter";font-weight:700;color:var(--blue);letter-spacing:.035em;text-transform:uppercase;line-height:1.25}
</style></head>
<body><div id="stage">
  <img id="bg" class="abs" src="bg.jpg" alt="">
  <div id="wash" class="abs"></div>
  <div id="col" class="abs">
    <h1 id="h"></h1>
    <div id="lead" class="serif"></div>
    <div id="stats" class="card"></div>
    <div id="record" class="card"><div class="lab"></div><div class="rows"></div></div>
    <div id="swipe"><span></span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
    <div id="foot"><div id="names"></div><img id="logo" src="logo-navy.png" alt="Jess Wilson's Liberal Victoria"></div>
  </div>
</div>
<script>
const P = Object.assign({
  // Defaults = the published layout. Override any key via ?p={"key":value} (see render.js).
  wash:[.90,.30,.88], top:83,
  head:'Labor has lost<br><span class="acc ul">control of crime.</span>', hSize:94,
  lead:'<span class="lt">Crime across Hume is</span> <span class="bd">up 30% since 2022</span>', leadSize:50,
  // Crime Statistics Agency, Hume LGA, year to June 2026 vs year to December 2022: [big, label, before → after]
  stats:[['+118%','motor vehicle<br>thefts','789 → 1,721'],['+54%','serious<br>assaults','643 → 992'],['+242%','train station<br>offences','149 → 509']],
  statN:80, statL:22, statD:20,
  record:{lab:'Labor’s record', labSize:18, size:24, rows:[
    '<b>Craigieburn Police Station</b> cut from 24/7 to two days a week',
    '<b>723 Victorians</b> became a victim of crime every day',
    '<b>1,400+</b> vacancies on Victoria Police rosters',
    '<b>40+</b> police stations closed or on reduced hours',
    '<b>279,102</b> crimes remain unsolved',
    '<b>PSOs stripped</b> from 119 train stations',
    '<b>A crime every 50 seconds</b> across Victoria',
  ]},
  swipe:'Swipe for our plan', swipeSize:21,
  gaps:[26,44,26,40,0,36],               // after head, lead, stats, record, (unused), swipe
  // candidates, ordered by electorate
  cands:[],                              // no candidate names on this slide (they sign off slide 2)
  nameSize:44, roleSize:16, nameGap:20, colW:280, logoW:136, footGap:14
}, JSON.parse(new URLSearchParams(location.search).get('p')||'{}'));
const $=id=>document.getElementById(id), px=v=>v+'px';
const W=$('wash').style; W.setProperty('--w-top',P.wash[0]); W.setProperty('--w-mid',P.wash[1]); W.setProperty('--w-bot',P.wash[2]);
$('col').style.setProperty('--top',px(P.top));
$('h').innerHTML=P.head; $('h').style.fontSize=px(P.hSize);
$('lead').innerHTML=P.lead; $('lead').style.fontSize=px(P.leadSize);
$('stats').innerHTML=P.stats.map(([n,l,d])=>`<div class="st"><div class="n" style="font-size:${P.statN}px">${n}</div><div class="l" style="font-size:${P.statL}px">${l}</div>${d?`<div class="d" style="font-size:${P.statD}px">${d}</div>`:''}</div>`).join('');
const R=P.record, cross=`<svg width="${R.size*1.45}" height="${R.size*1.45}" viewBox="0 0 34 34"><circle cx="17" cy="17" r="16" fill="#d7262e"/><path d="M11.5 11.5l11 11M22.5 11.5l-11 11" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/></svg>`;
$('record').querySelector('.lab').innerHTML=R.lab; $('record').querySelector('.lab').style.fontSize=px(R.labSize);
$('record').querySelector('.rows').innerHTML=R.rows.map(t=>`<div class="x" style="font-size:${R.size}px">${cross}<span>${t}</span></div>`).join('');
$('swipe').querySelector('span').innerHTML=P.swipe; $('swipe').style.fontSize=px(P.swipeSize);
[['h',0],['lead',1],['stats',2],['record',3],['swipe',5]].forEach(([id,i])=>$(id).style.marginBottom=px(P.gaps[i]));
$('names').innerHTML=P.cands.map(([n,r])=>`<div class="cand"><div class="n" style="font-size:${P.nameSize}px">${n}</div><div class="r" style="font-size:${P.roleSize}px">${r}</div></div>`).join('');
$('names').style.setProperty('--ngap',px(P.nameGap)); if(!P.cands.length) $('names').style.display='none'; $('names').style.setProperty('--ncols',P.cands.length); $('names').style.setProperty('--ncol',px(P.colW));
document.fonts.ready.then(()=>document.querySelectorAll('.cand .n').forEach(el=>{const m=-(el.offsetWidth*(1-0.86)/2); el.style.marginLeft=el.style.marginRight=m+'px';}));
$('logo').style.width=px(P.logoW); $('foot').style.gap=px(P.footGap);
document.fonts.ready.then(()=>document.querySelectorAll('.serif .bd').forEach(el=>{const m=-(el.offsetWidth*(1-0.86)/2); el.style.marginLeft=el.style.marginRight=m+'px';}));
</script>
</body></html>
