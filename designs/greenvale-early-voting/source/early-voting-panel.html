<!doctype html>
<html><head><meta charset="utf-8">
<!-- 1080x1350 early voting card: the "Early Voting centres" reference layout (two-tone heading, rounded
     panel with ticked venues, name block + logo along the bottom; candidate photo left out for symmetry) in the light "Postal" style (white, navy/blue, Inter + condensed serif). -->
<style>
@font-face{font-family:"Serif Bold";src:url(DMSerifDisplay-Regular.ttf)}
@font-face{font-family:"Serif Light";src:url(InstrumentSerif-Regular.ttf)}
@font-face{font-family:"Inter";font-weight:500;src:url(Inter-Medium.otf)}
@font-face{font-family:"Inter";font-weight:600;src:url(Inter-SemiBold.otf)}
@font-face{font-family:"Inter";font-weight:700;src:url(Inter-Bold.otf)}
@font-face{font-family:"Inter";font-weight:800;src:url(Inter-ExtraBold.otf)}
:root{ --navy:#162133; --blue:#00539a; --shadow:0 2px 6px rgba(20,32,60,.16); }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#fff}
#stage{position:relative;width:1080px;height:1350px;overflow:hidden;background:#fff}
.abs{position:absolute}
.center{left:0;right:0;text-align:center}
h1{font-family:"Inter";font-weight:800;color:var(--navy);letter-spacing:-.035em;line-height:1;white-space:nowrap;text-shadow:var(--shadow)}
h1 .acc{color:var(--blue)}
/* the electorate name: larger, with a thick blue underline */
h1 .gv{display:inline-block;font-size:1.3em;letter-spacing:-.04em;margin-bottom:.16em;
  text-decoration:underline;text-decoration-color:var(--blue);text-decoration-thickness:.075em;text-underline-offset:.13em}
.serif{color:var(--blue);line-height:1.08;letter-spacing:-.015em;text-shadow:var(--shadow)}
.serif .lt{font-family:"Serif Light";font-size:1.12em;letter-spacing:-.02em}
.serif .bd{font-family:"Serif Bold";display:inline-block;transform:scaleX(.86);transform-origin:50% 50%}
.note{font-family:"Inter";font-weight:700;color:var(--navy);letter-spacing:-.02em;line-height:1.25;text-shadow:var(--shadow)}
/* pale panel: the light-style answer to the reference's dark rounded box */
#panel{border-radius:40px;background:linear-gradient(170deg,#f1f6fc 0%,#e6eff9 100%);
  box-shadow:inset 0 0 0 1.5px rgba(0,83,154,.10),0 18px 40px rgba(20,40,80,.08)}
.v{position:absolute;display:flex;gap:26px;align-items:flex-start}
.tick{flex:none;width:46px;height:46px;margin-top:4px}
.v .sub{font-family:"Serif Bold";color:var(--blue);line-height:1;letter-spacing:-.01em;transform:scaleX(.86);transform-origin:0 50%;white-space:nowrap;text-shadow:var(--shadow)}
.v .det{margin-top:12px;font-family:"Inter";font-weight:600;color:var(--navy);letter-spacing:-.015em;line-height:1.32}
.v .det .bar{color:var(--blue);font-weight:500;margin:0 .35em}
#footer{left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:var(--fgap,26px)}
#name{text-align:center}
#name .n{font-family:"Serif Bold";color:var(--navy);line-height:1;letter-spacing:-.01em;white-space:nowrap;text-shadow:var(--shadow);
  display:inline-block;transform:scaleX(.86)}
#name .r{margin-top:8px;font-family:"Inter";font-weight:700;color:var(--blue);letter-spacing:.035em;text-transform:uppercase;line-height:1.25}
</style></head>
<body><div id="stage">
  <h1 id="h" class="abs center"></h1>
  <div id="dates" class="abs center serif"></div>
  <div id="hours" class="abs center note"></div>
  <div id="panel" class="abs"></div>
  <div id="list"></div>
  <div id="footer" class="abs">
    <div id="name"><div class="n"></div><div class="r"></div></div>
    <img id="logo" src="logo-navy.png" alt="Jess Wilson's Liberal Victoria">
  </div>
</div>
<script>
const P = Object.assign({
  // Defaults = the published layout. Override any key via ?p={"key":value} (see render.js).
  head:'<span class="gv">Greenvale</span><br><span class="acc">Early voting</span> centres', hTop:54, hSize:94,
  dates:'<span class="lt">Pre<span style="margin:0 -.07em">-</span>poll is open</span> <span class="bd">18–27 November</span>', dTop:310, dSize:58,
  hours:'9 am–6 pm, closed Sunday 22 November.', hrTop:392, hrSize:28,
  panel:[60,468,960,540],                  // left, top, width, height
  // venues: [suburb, venue, address, left, top, width] — one centred column; long lines wrap after the bar
  venues:[
    ['Attwood','Attwood House Community Centre','202 Erinbank Crescent',140,524,820],
    ['Craigieburn','Yellowbox Drive Voting Centre','23 Yellowbox Drive',140,674,820],
    ['Roxburgh Park','Roxburgh Park Football Club','Lakeside Reserve, 75 Lakeside Drive',140,824,820],
  ],
  subSize:54, detSize:26,
  footerTop:1062, footerGap:18,
  name:{size:74, text:'Jim Overend', role:'Liberal for Greenvale', roleSize:25},
  logoW:210
}, JSON.parse(new URLSearchParams(location.search).get('p')||'{}'));
const $=id=>document.getElementById(id), px=v=>v+'px';
Object.assign($('h').style,{top:px(P.hTop),fontSize:px(P.hSize)}); $('h').innerHTML=P.head;
Object.assign($('dates').style,{top:px(P.dTop),fontSize:px(P.dSize)}); $('dates').innerHTML=P.dates;
Object.assign($('hours').style,{top:px(P.hrTop),fontSize:px(P.hrSize)}); $('hours').innerHTML=P.hours;
const [pl,pt,pw,ph]=P.panel; Object.assign($('panel').style,{left:px(pl),top:px(pt),width:px(pw),height:px(ph)});
const tick=`<svg class="tick" viewBox="0 0 46 46" fill="none" stroke="#00539a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M8 24.5 18.5 35 38 11"/></svg>`;
$('list').innerHTML=P.venues.map(([s,v,a,x,y,w])=>`<div class="v" style="left:${x}px;top:${y}px;width:${w}px">${tick}<div>
  <div class="sub" style="font-size:${P.subSize}px">${s}</div>
  <div class="det" style="font-size:${P.detSize}px">${v}<span class="bar">|</span>${(v+a).length>60?'<br>':''}${a}</div></div></div>`).join('');
document.fonts.ready.then(()=>document.querySelectorAll('.serif .bd').forEach(el=>{
  const w=el.offsetWidth, m=-(w*(1-0.86)/2); el.style.marginLeft=el.style.marginRight=m+'px'; }));
const N=P.name; $('footer').style.top=px(P.footerTop); $('footer').style.setProperty('--fgap',px(P.footerGap));
$('name').querySelector('.n').innerHTML=N.text; $('name').querySelector('.n').style.fontSize=px(N.size);
$('name').querySelector('.r').innerHTML=N.role; $('name').querySelector('.r').style.fontSize=px(N.roleSize);
$('logo').style.width=px(P.logoW);
</script>
</body></html>
