<!doctype html>
<html><head><meta charset="utf-8">
<!-- Slide 1 of the Technical Colleges carousel: the problem under Labor (jobs + TAFE). Same style as slide 2
     (tech-colleges.html): soft-blur aerial bg, white wash, pale cards, navy/blue type. -->
<style>
@font-face{font-family:"Serif Bold";src:url(DMSerifDisplay-Regular.ttf)}
@font-face{font-family:"Serif Light";src:url(InstrumentSerif-Regular.ttf)}
@font-face{font-family:"Inter";font-weight:500;src:url(Inter-Medium.otf)}
@font-face{font-family:"Inter";font-weight:600;src:url(Inter-SemiBold.otf)}
@font-face{font-family:"Inter";font-weight:700;src:url(Inter-Bold.otf)}
@font-face{font-family:"Inter";font-weight:800;src:url(Inter-ExtraBold.otf)}
:root{ --navy:#162133; --blue:#00539a; --shadow:0 2px 6px rgba(20,32,60,.16); }
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#fff}
#stage{position:relative;width:1080px;height:1350px;overflow:hidden;background:#fff}
.abs{position:absolute}
#bg{inset:0;width:1080px;height:1350px;object-fit:cover}
#wash{inset:0;background:linear-gradient(180deg,rgba(255,255,255,var(--w-top)) 0%,rgba(255,255,255,var(--w-top)) 20%,rgba(255,255,255,var(--w-mid)) 34%,rgba(255,255,255,var(--w-mid)) 76%,rgba(255,255,255,var(--w-bot)) 90%)}
#col{left:60px;right:60px;top:var(--top);display:flex;flex-direction:column;align-items:center;text-align:center}
h1{font-family:"Inter";font-weight:800;color:var(--navy);letter-spacing:-.035em;line-height:1.02;white-space:nowrap;text-shadow:var(--shadow)}
h1 .acc{color:var(--blue)}
h1 .ul{text-decoration:underline;text-decoration-color:var(--blue);text-decoration-thickness:.07em;text-underline-offset:.12em}
.serif{color:var(--blue);line-height:1.1;letter-spacing:-.015em;text-shadow:var(--shadow)}
.serif .lt{font-family:"Serif Light";font-size:1.12em;letter-spacing:-.02em}
.serif .bd{font-family:"Serif Bold";display:inline-block;transform:scaleX(.86)}
.card{width:100%;border-radius:32px;background:rgba(255,255,255,.93);backdrop-filter:blur(6px);
  box-shadow:inset 0 0 0 1.5px rgba(0,83,154,.10),0 18px 40px rgba(20,40,80,.10);padding:24px 36px 24px;text-align:left}
.card.pale{background:linear-gradient(170deg,rgba(241,246,252,.94),rgba(226,236,248,.94))}
.card .lab{font-family:"Inter";font-weight:700;color:var(--blue);letter-spacing:.07em;text-transform:uppercase;line-height:1}
.rows{margin-top:14px;display:flex;flex-direction:column}
.row{display:flex;gap:22px;align-items:center;padding:12px 0}
.row+.row{border-top:1.5px solid rgba(0,83,154,.10)}
.row .big{flex:none;font-family:"Serif Bold";color:var(--blue);line-height:1;white-space:nowrap;display:inline-block;transform:scaleX(.86);transform-origin:0 50%;text-shadow:var(--shadow)}
.row .t{font-family:"Inter";font-weight:600;color:var(--navy);letter-spacing:-.015em;line-height:1.28}
.row .t b{font-weight:800}
#src{font-family:"Inter";font-weight:500;color:rgba(22,33,51,.6);letter-spacing:-.005em;line-height:1.35;max-width:900px}
#swipe{display:inline-flex;align-items:center;gap:12px;padding:13px 26px;border-radius:999px;background:var(--blue);color:#fff;
  font-family:"Inter";font-weight:700;letter-spacing:-.01em;box-shadow:0 10px 24px rgba(0,83,154,.25)}
#swipe svg{width:1.1em;height:1.1em}
#foot{display:flex;flex-direction:column;align-items:center}
#name .n{font-family:"Serif Bold";color:var(--navy);line-height:1;letter-spacing:-.01em;white-space:nowrap;text-shadow:var(--shadow);display:inline-block;transform:scaleX(.86)}
#name .r{margin-top:5px;font-family:"Inter";font-weight:700;color:var(--blue);letter-spacing:.035em;text-transform:uppercase;line-height:1.25}
</style></head>
<body><div id="stage">
  <img id="bg" class="abs" src="bg.jpg" alt="">
  <div id="wash" class="abs"></div>
  <div id="col" class="abs">
    <h1 id="h"></h1>
    <div id="lead" class="serif"></div>
    <div id="cards"></div>
    <div id="src"></div>
    <div id="swipe"><span></span><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h15M13 6l6 6-6 6"/></svg></div>
    <div id="foot"><div id="name"><div class="n"></div><div class="r"></div></div><img id="logo" src="logo-navy.png" alt="Jess Wilson's Liberal Victoria"></div>
  </div>
</div>
<script>
const P = Object.assign({
  // Defaults = the published layout. Override any key via ?p={"key":value} (see render.js).
  wash:[.88,.22,.86], top:88,
  head:'Under Labor,<br><span class="acc ul">TAFE is failing</span>', hSize:80,
  lead:'<span class="lt">Victoria is facing a</span> <span class="bd">skills crisis</span>', leadSize:44,
  // cards: [label, pale?, [[big, text], ...]]
  cards:[
    ['Jobs under Labor',0,[
      ['Highest','unemployment rate in the nation'],
      ['12%','youth unemployment, and rising'],
      ['700,000','new vocationally qualified workers needed over the next decade'],
    ]],
    ['TAFE under Labor',1,[
      ['$73.5m','underlying TAFE sector deficit — <b>the largest since 2021</b>'],
      ['$718m','paid for Free TAFE, with no evidence it’s meeting its goals'],
      ['Lowest','student satisfaction with training quality in the nation'],
    ]],
  ],
  labSize:17, bigSize:50, bigW:190, textSize:21,
  src:'Sources: Victorian Auditor-General’s Office, 2025 TAFE audit and Free TAFE audit; Productivity Commission, Report on Government Services 2026 (mid-year); Liberal Party of Victoria.', srcSize:13,
  swipe:'Swipe for our plan', swipeSize:21,
  gaps:[18,26,16,18,22,24],               // after head, lead, card1(=between cards), cards, src, swipe
  name:{size:44, text:'Jim Overend', role:'Liberal for Greenvale', roleSize:17}, logoW:120, footGap:10
}, JSON.parse(new URLSearchParams(location.search).get('p')||'{}'));
const $=id=>document.getElementById(id), px=v=>v+'px';
const W=$('wash').style; W.setProperty('--w-top',P.wash[0]); W.setProperty('--w-mid',P.wash[1]); W.setProperty('--w-bot',P.wash[2]);
$('col').style.setProperty('--top',px(P.top));
$('h').innerHTML=P.head; $('h').style.fontSize=px(P.hSize);
$('lead').innerHTML=P.lead; $('lead').style.fontSize=px(P.leadSize);
$('cards').style.cssText=`width:100%;display:flex;flex-direction:column;gap:${P.gaps[2]}px`;
$('cards').innerHTML=P.cards.map(([lab,pale,rows])=>`<div class="card${pale?' pale':''}"><div class="lab" style="font-size:${P.labSize}px">${lab}</div><div class="rows">
  ${rows.map(([b,t])=>`<div class="row"><div style="flex:none;width:${P.bigW}px"><span class="big" style="font-size:${P.bigSize}px">${b}</span></div><div class="t" style="font-size:${P.textSize}px">${t}</div></div>`).join('')}</div></div>`).join('');
$('src').innerHTML=P.src; $('src').style.fontSize=px(P.srcSize);
$('swipe').querySelector('span').innerHTML=P.swipe; $('swipe').style.fontSize=px(P.swipeSize);
[['h',0],['lead',1],['cards',3],['src',4],['swipe',5]].forEach(([id,i])=>$(id).style.marginBottom=px(P.gaps[i]));
$('name').querySelector('.n').innerHTML=P.name.text; $('name').querySelector('.n').style.fontSize=px(P.name.size);
$('name').querySelector('.r').innerHTML=P.name.role; $('name').querySelector('.r').style.fontSize=px(P.name.roleSize);
$('logo').style.width=px(P.logoW); $('foot').style.gap=px(P.footGap);
document.fonts.ready.then(()=>document.querySelectorAll('.serif .bd').forEach(el=>{const m=-(el.offsetWidth*(1-0.86)/2); el.style.marginLeft=el.style.marginRight=m+'px';}));
</script>
</body></html>
